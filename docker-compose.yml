version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: c216_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: c216_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: c216_backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    # O volume abaixo espelha o código local para dentro do container para recarregamento automático (live reload)
    volumes:
      - ./backend:/app

volumes:
  postgres_data: