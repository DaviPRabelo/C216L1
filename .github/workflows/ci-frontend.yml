name: CI Frontend

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

defaults:
  run:
    working-directory: frontend

jobs:
  qualidade:
    name: Lint e formatação
    runs-on: ubuntu-latest

    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Configurar o Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar as dependências
        run: npm ci

      - name: Verificar o lint com Biome
        run: npm run lint

      - name: Verificar a formatação com Biome
        run: npm run format:check

  testes:
    name: Testes
    runs-on: ubuntu-latest
    needs: qualidade

    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Configurar o Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar as dependências
        run: npm ci

      - name: Executar os testes unitários e de integração
        run: npm run test

      - name: Gerar o bundle de produção
        run: npm run build

      - name: Instalar o navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Executar os testes E2E
        run: npm run test:e2e

      - name: Publicar o relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
