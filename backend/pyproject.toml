[tool.poetry]
name = "backend"
version = "0.1.0"
description = "Backend do projeto C216"
authors = ["DaviPRabelo <daviprabelo@gmail.com>"]
readme = "README.md"
packages = [{include = "backend"}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.110.0"
uvicorn = "^0.29.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx2 (>=2.13.0,<3.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]
[tool.pytest.ini_options]
testpaths = ["tests"]