name: CI Frontend

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

defaults:
  run:
    working-directory: frontend

jobs:
  qualidade:
    name: Lint e formatação
    runs-on: ubuntu-latest

    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Configurar o Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar as dependências
        run: npm ci

      - name: Verificar o lint com Biome
        run: npm run lint

      - name: Verificar a formatação com Biome
        run: npm run format:check

  testes:
    name: Testes
    runs-on: ubuntu-latest
    needs: qualidade

    env:
      DATABASE_URL: postgresql+psycopg://admin:adminpassword@localhost:5432/c216_db
      CORS_ORIGINS: http://localhost:5173,http://localhost:4173

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: adminpassword
          POSTGRES_DB: c216_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Configurar o Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar as dependências do frontend
        run: npm ci

      - name: Executar os testes unitários e de integração
        run: npm run test

      - name: Instalar o Poetry
        run: pipx install poetry

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry
          cache-dependency-path: backend/poetry.lock

      - name: Instalar as dependências do backend
        working-directory: backend
        run: poetry install --no-root

      - name: Aplicar as migrations
        working-directory: backend
        run: poetry run alembic upgrade head

      - name: Subir a API em segundo plano
        working-directory: backend
        run: |
          poetry run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/ > /dev/null && echo "API no ar" && exit 0
            sleep 2
          done
          echo "A API não subiu a tempo" && exit 1

      - name: Gerar o bundle de produção
        run: npm run build

      - name: Instalar o navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Executar os testes E2E
        run: npm run test:e2e

      - name: Publicar o relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
