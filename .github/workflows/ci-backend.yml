name: CI Backend

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  DATABASE_URL: postgresql+psycopg://admin:adminpassword@localhost:5432/c216_db
  TEST_DATABASE_URL: postgresql+psycopg://admin:adminpassword@localhost:5432/c216_test

jobs:
  testes:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: adminpassword
          POSTGRES_DB: c216_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Instalar o Poetry
        run: pipx install poetry

      - name: Configurar o Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry
          cache-dependency-path: backend/poetry.lock

      - name: Instalar as dependências
        run: poetry install --no-root

      - name: Aplicar as migrations
        run: poetry run alembic upgrade head

      - name: Executar os testes unitários
        run: poetry run pytest tests/unit --cov=app --cov-report=term

      - name: Executar os testes de integração
        run: poetry run pytest tests/integration --cov=app --cov-append --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Instalar o Poetry
        run: pipx install poetry

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry
          cache-dependency-path: backend/poetry.lock

      - name: Instalar as dependências
        run: poetry install --no-root

      - name: Verificar o lint com Ruff
        run: poetry run ruff check .
